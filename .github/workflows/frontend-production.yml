name: Frontend production o2switch

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-production.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publier le frontend en production
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_WP_ORIGIN: https://backoffice.2dayna2day.com
      NEXT_PUBLIC_WP_API_URL: https://backoffice.2dayna2day.com/wp-json/wp/v2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run config:production && npm run lint && npm run typecheck && npm run build:production
        working-directory: frontend
      - run: test -s frontend/dist/index.html && test -s frontend/dist/fr/index.html && test -d frontend/dist/_next/static
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production-${{ github.sha }}
          path: frontend/dist/
          # Apache routing configuration is part of the public static export.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://2dayna2day.com
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production-${{ github.sha }}
          path: frontend/dist
      - name: Transférer le frontend par FTPS et vérifier le site
        run: python3 frontend/scripts/deploy-o2switch-ftps.py
